<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>USSD Simulator</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    width:100vw;
    height:100vh;
}

.phone{
    position:relative;
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    background:#fff;
    overflow:hidden;
    border-radius:0;
    display:flex;
    flex-direction:column;
    box-shadow:none;
}


/* =========================
   TOP
========================= */

.top{
    position:relative;
    height:78px;
    min-height:78px;
    background:#fff;
    border:0;
    display:flex;
    align-items:flex-start;
    justify-content:flex-start;
    padding:24px 20px 0;
}


/* =========================
   ACTIONS
========================= */

.actions{
    height:185px;
    min-height:185px;
    background:#fff;
    padding:4px 30px 0;
    direction:ltr;
    position:relative;
    top:-48px;
}

.action{
    height:55px;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    flex-direction:row;
    gap:18px;
    color:#333;
    font-size:17px;
    white-space:nowrap;
    direction:ltr;
}

.action > div:last-child{
    transform:translateY(-3px);
}

.action-icon{
    width:32px;
    min-width:32px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}


/* =========================
   PERSON ICON
========================= */

.person-icon{
    position:relative;
    width:15px;
    height:15px;
    border:2px solid #555;
    border-radius:50%;
    top:-9px;
}

.person-icon::after{
    content:"";
    position:absolute;
    width:25px;
    height:16px;
    left:50%;
    transform:translateX(-50%);
    top:16px;
    border:2px solid #555;
    border-bottom:0;
    border-radius:18px 18px 0 0;
}


/* =========================
   MESSAGE ICON
========================= */

.message-icon{
    position:relative;
    width:31px;
    height:25px;
    border:2px solid #555;
    border-radius:50%;
}

.message-icon::after{
    content:"";
    position:absolute;
    left:3px;
    bottom:-6px;
    width:9px;
    height:9px;
    border-left:2px solid #555;
    border-bottom:2px solid #555;
    transform:rotate(-18deg);
    background:#fff;
}


/* =========================
   NUMBER
========================= */

.number-area{
    height:80px;
    min-height:80px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    padding:0 70px;
}

.number{
    width:100%;
    height:55px;
    line-height:55px;
    direction:ltr;
    unicode-bidi:plaintext;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    font-size:31px;
    font-weight:400;
    letter-spacing:1px;

    transition:
        font-size .13s ease,
        letter-spacing .13s ease;
}


/* =========================
   DELETE
========================= */

.delete{
    position:absolute;
    left:23px;
    top:22px;
    width:42px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#555;
    font-size:29px;
    cursor:pointer;
}


/* =========================
   THREE DOTS
========================= */

.more{
    position:absolute;
    right:18px;
    top:18px;
    width:38px;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:0;
    color:#444;
    font-size:30px;
    line-height:1;
    cursor:pointer;
    padding:0;
}

.more:active{
    transform:scale(.9);
}


/* =========================
   KEYPAD
========================= */

.keypad{
    flex:1;
    min-height:0;
    background:#fff;
    padding:6px 22px 2px;
    direction:ltr;
}

.keys{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
    direction:ltr;
}

.key{
    height:61px;
    border:0;
    border-radius:34px;
    background:#f3f0ed;
    color:#333;
    font-family:Arial,Tahoma,sans-serif;
    font-size:25px;
    font-weight:400;
    text-align:center;
    direction:ltr;
    cursor:pointer;
    padding:0;

    transition:
        transform .08s,
        background .08s;
}

.key small{
    display:block;
    font-size:10px;
    line-height:12px;
    font-weight:400;
    letter-spacing:1px;
    margin-top:2px;
}

.key:active{
    transform:scale(.95);
    background:#e6e2df;
}


/* =========================
   CALL UNDER ZERO
========================= */

.call-row{
    width:100%;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:9px;

    margin-top:9px;

    direction:ltr;
}

.call-empty{
    height:50px;
}

.call{
    grid-column:2;

    width:175px;
    max-width:100%;

    height:50px;

    justify-self:center;

    border:0;
    border-radius:30px;

    background:#23883e;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    direction:ltr;

    gap:10px;

    font-family:Arial,Tahoma,sans-serif;

    font-size:20px;
    font-weight:400;

    cursor:pointer;
}

.call:active{
    transform:scale(.97);
}


/* =========================
   CALL ICON
========================= */

.call-icon{
    width:25px;
    height:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.call-icon svg{
    width:25px;
    height:25px;

    display:block;

    fill:#fff;
}


/* =========================
   BOTTOM
========================= */

.bottom{
    height:68px;
    min-height:68px;

    flex-shrink:0;

    background:#fff;

    border-top:0;

    display:flex;

    direction:ltr;

    justify-content:space-around;
    align-items:center;

    color:#666;
}

.bottom-item{
    width:50%;
    height:58px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    font-size:12px;

    border-radius:14px;

    transition:.15s;

    direction:rtl;
}

.bottom-item.selected{
    color:#111;
    background:#f2efec;
}

.bottom-item.home-item{
    color:#111;
}

.bottom-icon{
    display:block;

    height:29px;

    font-size:27px;

    line-height:27px;

    margin-bottom:3px;
}


/* =========================
   USSD OVERLAY
========================= */

.overlay{
    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    background:rgba(0,0,0,.30);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:100;
}

.dialog{
    width:92%;
    max-width:355px;

    background:#fffaf7;

    border-radius:24px;

    padding:
        20px
        19px
        14px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.28);

    animation:pop .18s ease;
}

@keyframes pop{

    from{
        transform:scale(.93);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}


.dialog-header{
    display:flex;

    align-items:center;
    justify-content:center;

    direction:rtl;

    gap:7px;

    font-size:18px;

    color:#222;

    margin-bottom:14px;
}

.ussd-text{
    direction:ltr;
    display:inline-block;
}

.badge{
    display:inline-flex;

    width:30px;
    height:30px;

    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:#e52c3d;

    color:#fff;

    font-size:16px;

    font-weight:bold;
}


.message{
    color:#333;

    font-size:16px;

    line-height:1.55;

    text-align:right;

    white-space:pre-line;

    margin:0;
}


.ussd-input{
    width:100%;
    height:40px;

    border:0;

    border-bottom:1px solid #777;

    outline:none;

    background:transparent;

    font-size:17px;

    direction:ltr;

    text-align:right;

    margin-top:7px;
}


.buttons{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-top:11px;
}

.buttons button{
    border:0;

    background:transparent;

    color:#777;

    font-size:16px;

    padding:5px 14px;

    cursor:pointer;
}

.buttons .send{
    color:#333;
}


/* =========================
   LOADING
========================= */

.loader{
    width:280px;
    max-width:280px;

    min-height:155px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:22px 18px 20px;
}

.loader-title{
    font-size:19px;

    color:#333;

    direction:rtl;
}

.spinner{
    width:43px;
    height:43px;

    min-width:43px;
    min-height:43px;

    margin:14px auto 0;

    border:4px solid #ddd;

    border-top:4px solid #23843b;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================
   SHORT SCREEN
========================= */

@media(max-height:700px){

    .phone{
        width:100%;
        height:100%;
        margin:0;
        border-radius:0;
        box-shadow:none;
    }

    .top{
        height:65px;
        min-height:65px;
        padding-top:19px;
    }

    .actions{
        height:150px;
        min-height:150px;
        padding-top:0;
        top:-48px;
    }

    .action{
        height:46px;
        font-size:16px;
    }

    .action > div:last-child{
        transform:translateY(-2px);
    }

    .number-area{
        height:67px;
        min-height:67px;
    }

    .more{
        top:12px;
        right:14px;
    }

    .key{
        height:50px;
    }

    .call-row{
        margin-top:7px;
    }

    .call{
        height:46px;
        width:165px;
        font-size:19px;
    }

    .call-icon{
        width:24px;
        height:24px;
    }

    .call-icon svg{
        width:24px;
        height:24px;
    }

    .bottom{
        height:55px;
        min-height:55px;
    }

    .bottom-item{
        height:49px;
    }
}


@media(min-width:431px){

    .phone{
        width:100%;
        max-width:none;
    }
}

</style>
</head>

            <button class="key" onclick="add('0')">

            <button class="key" onclick="add('#')">
                #

        <div class="call-row">

            <div class="call-empty"></div>

                        <path d="

                    </svg>

                </span>

                    اتصال
                </span>

            </button>

            <div class="call-empty"></div>

        </div>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <div class="bottom-item home-item">

            <span class="bottom-icon">
                ⌂
            </span>

            الصفحة الرئيسية

        </div>


        <div class="bottom-item selected">

            <span class="bottom-icon">
                ⠿
            </span>

            لوحة المفاتيح

        </div>

    </div>

</div>


<!-- =========================
     USSD WINDOW
========================= -->

<div class="overlay"
     id="ussdOverlay">

    <div class="dialog">

        <div class="dialog-header">

            <span class="badge">
                1
            </span>

            <span>
                رسالة
            </span>

            <span class="ussd-text">
                Vodafone
            </span>

        </div>


        <div class="message"
             id="message">
        </div>


        <input
            id="ussdInput"
            class="ussd-input"
            autocomplete="off"
            inputmode="numeric">


        <div class="buttons">

            <button onclick="closeUSSD()">
                إلغاء
            </button>

            <button class="send"
                    onclick="sendUSSD()">
                إرسال
            </button>

        </div>

    </div>

</div>


<!-- =========================
     LOADING
========================= -->

<div class="overlay"
     id="loadingOverlay">

    <div class="dialog loader">

        <div class="loader-title">
            تشغيل USSD...
        </div>

        <div class="spinner"></div>

    </div>

</div>

/* =========================
   اختيار عشوائي
========================= */

function randomItem(array){

    return array[
        Math.floor(
            Math.random() * array.length
        )
    ];

}


/* =========================
   إخفاء الاسم بالنجوم
========================= */

function maskName(name){

    if(!name)
        return "*****";

    return name.charAt(0) + "*****";

}


/* =========================
   إنشاء اسم جديد
========================= */

function randomName(){

    const first =
        randomItem(firstNames);

    const middle =
        randomItem(middleNames);

    const family =
        randomItem(familyNames);


    return first +
        " " +
        maskName(middle) +
        " " +
        maskName(family);

}


/* =========================
   NUMBER SIZE
========================= */

function updateNumberSize(){

    const display =
        document.getElementById("display");

    const length =
        dialNumber.length;

    let size = 31;

    if(length <= 8)
        size = 31;

    else if(length === 9)
        size = 29;

    else if(length === 10)
        size = 28;

    else if(length === 11)
        size = 26;

    else if(length === 12)
        size = 24;

    else if(length === 13)
        size = 22;

    else if(length === 14)
        size = 21;

    else if(length === 15)
        size = 20;

    else
        size = 18;


    display.style.fontSize =
        size + "px";

    display.style.letterSpacing =
        length >= 13
        ? "0"
        : "1px";

}


/* =========================
   ADD
========================= */

function add(value){

    dialNumber += value;

    document
        .getElementById("display")
        .textContent =
        dialNumber;

    updateNumberSize();

}


/* =========================
   DELETE
========================= */

function deleteNumber(){

    dialNumber =
        dialNumber.slice(0,-1);

    document
        .getElementById("display")
        .textContent =
        dialNumber;

    updateNumberSize();

}


/* =========================
   CLEAR
========================= */

function clearAll(){

    dialNumber = "";

    document
        .getElementById("display")
        .textContent = "";

    updateNumberSize();

}


/* =========================
   THREE DOTS
========================= */

function moreMenu(){

    if(navigator.vibrate){

        navigator.vibrate(20);

    }

}


/* =========================
   START USSD
========================= */

function startUSSD(){

    if(dialNumber.trim() === "")
        return;


    const match =
        dialNumber.match(
            /^\*9\*7\*(01\d{9})\*(\d+)#?$/
        );


    if(!match){

        alert(
            "اكتب الكود بالشكل:\n\n" +
            "*9*7*010XXXXXXXX*500"
        );

        return;

    }


    targetNumber = match[1];

    transferAmount = match[2];

    selectedName = randomName();


    dialNumber = "";


    document
        .getElementById("display")
        .textContent = "";


    updateNumberSize();


    showLoading();


    setTimeout(function(){

        hideLoading();

        step = 1;

        showFirstMessage();

    },1000);

}


/* =========================
   LOADING
========================= */

function showLoading(){

    document
        .getElementById("loadingOverlay")
        .style.display =
        "flex";

}


function hideLoading(){

    document
        .getElementById("loadingOverlay")
        .style.display =
        "none";

}


/* =========================
   OPEN USSD
========================= */

function openUSSD(){

    document
        .getElementById("ussdOverlay")
        .style.display =
        "flex";


    const input =
        document.getElementById("ussdInput");


    input.value = "";

    input.type = "text";

    input.placeholder = "";


    setTimeout(function(){

        input.focus();

    },50);

}


/* =========================
   CLOSE USSD
========================= */

function closeUSSD(){

    document
        .getElementById("ussdOverlay")
        .style.display =
        "none";


    document
        .getElementById("ussdInput")
        .value = "";


    step = 0;

}


/* =========================
   FIRST MESSAGE
========================= */

function showFirstMessage(){

    openUSSD();


    document
        .getElementById("message")
        .textContent =

`تحويل ${transferAmount} ج بالإضافة إلى 1 ج رسوم
${targetNumber} باسم
${selectedName}
0: مزيد`;


    document
        .getElementById("ussdInput")
        .placeholder = "";

}


/* =========================
   SEND
========================= */

function sendUSSD(){

    const input =
        document
            .getElementById("ussdInput")
            .value
            .trim();


    if(step === 1){

        if(input !== "0")
            return;


        document
            .getElementById("ussdOverlay")
            .style.display =
            "none";


        showLoading();


        setTimeout(function(){

            hideLoading();

            step = 2;

            showPassword();

        },800);


        return;

    }


    if(step === 2){

        if(input.length < 1)
            return;


        document
            .getElementById("ussdOverlay")
            .style.display =
            "none";


        showLoading();


        setTimeout(function(){

            hideLoading();

            step = 3;

            showResult();

        },1200);


        return;

    }


    if(step === 3){

        if(input === "#9"){

            closeUSSD();

        }

    }

}


/* =========================
   PASSWORD
========================= */

function showPassword(){

    openUSSD();


    document
        .getElementById("message")
        .textContent =
        "أدخل كلمة المرور";


    const input =
        document.getElementById("ussdInput");


    input.value = "";

    input.type = "password";

    input.placeholder =
        "كلمة المرور";

    input.focus();

}


/* =========================
   RESULT
========================= */

function showResult(){

    openUSSD();


    const input =
        document.getElementById("ussdInput");


    input.type = "text";

    input.value = "";


    document
        .getElementById("message")
        .textContent =

`تم تحويل ${transferAmount} جنيه لرقم
${targetNumber} مصاريف الخدمة 1.0 جنيه
اطلب #9* و
0 مزيد`;


    input.placeholder = "";

    input.focus();

}


/* =========================
   ENTER
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            document
                .getElementById("ussdOverlay")
                .style.display === "flex"
        ){

            sendUSSD();

        }

    }
);


/* =========================
   PREVENT MENU
========================= */

document.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

    }
);
